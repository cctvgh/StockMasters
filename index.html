<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股/B股/港股大师分析</title>
<style>
  :root {
    --blue: #2b6cb0; --blue-light: #ebf4ff; --blue-mid: #90cdf4;
    --bg: #f0f7ff; --card: #ffffff; --border: #dbeafe;
    --text: #1a202c; --text2: #4a5568; --text3: #718096;
    --green: #16a34a; --red: #dc2626; --amber: #d97706;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  body { background:linear-gradient(180deg,#e8f2fe 0%,var(--bg) 240px); color:var(--text); min-height:100vh; }
  .wrap { max-width:1060px; margin:0 auto; padding:24px 20px 60px; }

  header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .logo { width:42px; height:42px; border-radius:10px; background:var(--blue);
          display:flex; align-items:center; justify-content:center; color:#fff; flex:none; }
  h1 { font-size:21px; font-weight:600; letter-spacing:.5px; }
  .sub { font-size:12px; color:var(--text3); margin-top:2px; }

  .searchbar { display:flex; gap:10px; margin-bottom:22px; }
  .searchbar input { flex:1; height:46px; border:2px solid var(--border); border-radius:10px;
    background:#fff; padding:0 16px; font-size:16px; outline:none; transition:.2s; }
  .searchbar input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(43,108,176,.12); }
  .searchbar button { height:46px; padding:0 30px; border:none; border-radius:10px;
    background:var(--blue); color:#fff; font-size:15px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:8px; transition:.15s; }
  .searchbar button:hover { background:#245a97; }
  .searchbar button:disabled { background:#a0aec0; cursor:not-allowed; }
  .quick { font-size:12px; color:var(--text3); margin:-12px 0 22px; }
  .quick a { color:var(--blue); cursor:pointer; margin-right:10px; }
  .quick a:hover { text-decoration:underline; }

  .status { padding:44px 20px; text-align:center; color:var(--text3); font-size:14px;
    background:var(--card); border:1px solid var(--border); border-radius:14px; }
  .spinner { width:30px; height:30px; border:3px solid var(--blue-mid); border-top-color:var(--blue);
    border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .stockbar { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 22px;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px 22px; margin-bottom:16px; }
  .stockbar .name { font-size:20px; font-weight:700; }
  .stockbar .code { font-size:13px; color:var(--text3); letter-spacing:1px; }
  .stockbar .price { font-size:24px; font-weight:700; }
  .up { color:var(--red); } .down { color:var(--green); }
  .chip { font-size:12.5px; color:var(--text2); background:var(--blue-light);
    border:1px solid var(--border); padding:3px 10px; border-radius:20px; }
  .err { background:#fef2f2; border:1px solid #fecaca; color:var(--red);
    padding:16px 22px; border-radius:14px; margin-bottom:16px; font-size:14px; }

  .consensus { display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center;
    background:linear-gradient(135deg,#ffffff 0%,#eef6ff 100%);
    border:1px solid var(--border); border-radius:16px; padding:22px 26px; margin-bottom:20px;
    box-shadow:0 2px 12px rgba(43,108,176,.06); }
  .cscore-ring { width:120px; height:120px; border-radius:50%; position:relative; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--blue) calc(var(--pct)*1%), var(--blue-mid) 0); }
  .cscore-ring::before { content:""; position:absolute; inset:9px; border-radius:50%; background:#fff; }
  .cscore-ring .num { position:relative; font-size:30px; font-weight:800; color:var(--blue); }
  .cscore-ring .den { position:relative; font-size:11px; color:var(--text3); margin-top:-4px; }
  .cscore-inner { display:flex; flex-direction:column; align-items:center; }
  .cinfo h2 { font-size:20px; margin-bottom:4px; }
  .cinfo .signal { font-size:14px; font-weight:600; padding:3px 14px; border-radius:20px;
    display:inline-block; margin:6px 0 8px; }
  .sig-buy { background:#dcfce7; color:var(--green); }
  .sig-hold { background:#fef9c3; color:var(--amber); }
  .sig-sell { background:#fee2e2; color:var(--red); }
  .cinfo .desc { font-size:13px; color:var(--text2); line-height:1.6; }
  .dist { display:flex; gap:10px; margin-top:10px; font-size:12px; }
  .dist span { padding:2px 10px; border-radius:12px; }
  .d-b { background:#fee2e2; color:var(--red); }
  .d-n { background:#f1f5f9; color:var(--text2); }
  .d-s { background:#dcfce7; color:var(--green); }

  .mgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px; }
  .mcard { background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; transition:.15s; }
  .mcard:hover { box-shadow:0 4px 16px rgba(43,108,176,.10); transform:translateY(-1px); }
  .mhead { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .micon { width:34px; height:34px; border-radius:8px; background:var(--blue-light);
    color:var(--blue); display:flex; align-items:center; justify-content:center; flex:none; }
  .mhead .t { flex:1; }
  .mhead .nm { font-size:15px; font-weight:700; }
  .mhead .sc { font-size:11px; color:var(--text3); }
  .mscore { font-size:22px; font-weight:800; text-align:right; }
  .bar { height:6px; background:#e2e8f0; border-radius:3px; margin:8px 0 10px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:3px; background:var(--blue); }
  .v-bull { color:var(--red); } .v-neu { color:var(--amber); } .v-bear { color:var(--green); }
  .mverdict { font-size:12px; font-weight:600; margin-bottom:6px; }
  .mreasons { list-style:none; }
  .mreasons li { font-size:12.5px; color:var(--text2); line-height:1.65; padding-left:14px; position:relative; }
  .mreasons li::before { content:""; position:absolute; left:2px; top:8px; width:5px; height:5px;
    border-radius:50%; background:var(--blue-mid); }
  footer { text-align:center; font-size:11.5px; color:var(--text3); margin-top:34px; line-height:1.8; }
  .tag { font-size:10.5px; color:var(--text3); border:1px solid var(--border);
    padding:1px 8px; border-radius:10px; margin-left:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727-3.001-3A2 2 0 0 0 7 10l-4 4v2"/><path d="M2 17l1 1"/><path d="M22 7v4"/><path d="M2 13l4-4c.912-.585 2.36-.62 3.3 0l3 3"/><circle cx="16" cy="8" r="1"/></svg>
    </div>
    <div>
      <h1>A股/B股/港股大师分析</h1>
      <div class="sub">六位投资大师视角 · A股+B股+港股 · 东财/同花顺/新浪/百度数据</div>
    </div>
  </header>

  <div class="searchbar">
    <input id="code" placeholder="输入股票代码: A股600900 / B股200596 / 港股00700" maxlength="6" inputmode="numeric">
    <button id="btn" onclick="run()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      分析
    </button>
  </div>
  <div class="quick">
    快捷: <a onclick="quick('600900')">600900 长江电力</a><a onclick="quick('601398')">601398 工商银行</a><a onclick="quick('600519')">600519 贵州茅台</a><a onclick="quick('200596')">200596 古井贡B</a><a onclick="quick('00700')">00700 腾讯控股</a>
  </div>

  <div id="result">
    <div class="status">
      输入股票代码开始分析<br><span style="font-size:12px">A股6位 / B股6位(200/900开头) / 港股1-5位 · 六位大师独立打分并形成加权共识</span>
    </div>
  </div>

  <footer>
数据来源: 东方财富 / 同花顺 / 新浪财经 / 百度估值 (akshare 开源库) · 评分由规则引擎计算<br>
本工具仅供学习研究, 不构成投资建议 · 股市有风险, 入市需谨慎
  </footer>
</div>

<script>
const ICONS = {
  value:'<path d="M6 3h12M9 3v8.5a3 3 0 0 0 3 3 3 3 0 0 1 3 3V21H9"/>',
  quality:'<path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>',
  growth:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
  dividend:'<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
  momentum:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  margin:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .65-.94l7-2.5a1 1 0 0 1 .7 0l7 2.5A1 1 0 0 1 20 6Z"/>'
};
function icon(id){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[id]+'</svg>';}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cls(n){return n>=0?'up':'down';}

function quick(c){document.getElementById('code').value=c;run();}
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')run();});

async function run(){
  const code=document.getElementById('code').value.replace(/\D/g,'');
  if(code.length<1||code.length>6||!/\d+/.test(code)){alert('请输入股票代码: A股600900 / B股200596 / 港股00700');return;}
  const btn=document.getElementById('btn');btn.disabled=true;
  const box=document.getElementById('result');
  box.innerHTML='<div class="status"><div class="spinner"></div>正在获取行情、财务与估值数据<br><span style="font-size:12px">首次分析约需 10~30 秒, 请稍候</span></div>';
  try{
    const r=await fetch('/api/analyze?code='+code);
    const d=await r.json();
    if(d.error){box.innerHTML='<div class="err">'+esc(d.error)+'</div>';return;}
    render(d);
  }catch(e){
    box.innerHTML='<div class="err">请求失败: '+esc(e.message)+'<br>请确认服务已启动且网络可用</div>';
  }finally{btn.disabled=false;}
}

function render(d){
  const p=d.price||{},v=d.valuation||{},f=d.fundamentals||{},dv=d.dividend||{},c=d.consensus;
  const chg=p.change_pct;
  const chips=[];
  if(v.pe_ttm!=null)chips.push('PE(TTM) '+v.pe_ttm.toFixed(1));
  if(v.pb!=null)chips.push('PB '+v.pb.toFixed(2));
  if(v.pe_percentile_3y!=null)chips.push('PE分位 '+v.pe_percentile_3y+'%');
  if(dv.yield_pct!=null)chips.push('股息率 '+dv.yield_pct.toFixed(2)+'%');
  if(v.mcap_yi!=null)chips.push('市值 '+v.mcap_yi+'亿');
  if(f.roe!=null)chips.push('ROE '+f.roe.toFixed(1)+'%');
  if(p.high_52w!=null)chips.push('52周高 '+p.high_52w);
  if(p.low_52w!=null)chips.push('52周低 '+p.low_52w);

  const sigCls=c.score>=6.5?'sig-buy':c.score>=3.5?'sig-hold':'sig-sell';
  const masterCards=d.masters.map(m=>{
    const vc=m.verdict==='偏多'?'v-bull':m.verdict==='偏空'?'v-bear':'v-neu';
    return '<div class="mcard"><div class="mhead"><div class="micon">'+icon(m.id)+
      '</div><div class="t"><div class="nm">'+esc(m.name)+'<span class="tag">'+esc(m.school)+'</span></div><div class="sc">权重 '+Math.round(m.weight*100)+'%</div></div>'+
      '<div style="text-align:right"><div class="mscore">'+m.score.toFixed(1)+'</div><div class="mverdict '+vc+'">'+m.verdict+'</div></div></div>'+
      '<div class="bar"><i style="width:'+(m.score*10)+'%"></i></div><ul class="mreasons">'+
      m.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>';
  }).join('');

  document.getElementById('result').innerHTML=
    '<div class="stockbar"><span class="name">'+esc(d.name)+'</span><span class="code">'+esc(d.code)+'</span>'+
    '<span class="price '+(chg>=0?'up':'down')+'">'+p.price+'</span>'+
    '<span class="'+(chg>=0?'up':'down')+'" style="font-size:14px;font-weight:600">'+(chg>=0?'▲':'▼')+' '+Math.abs(chg)+'%</span>'+
    '<span style="font-size:12px;color:var(--text3)">'+esc(p.date||'')+'</span>'+
    chips.map(t=>'<span class="chip">'+t+'</span>').join('')+'</div>'+
    '<div class="consensus"><div class="cscore-inner"><div class="cscore-ring" style="--pct:'+(c.score*10)+'">'+
    '<div style="position:relative;text-align:center"><div class="num">'+c.score.toFixed(1)+'</div><div class="den">综合评分/10</div></div></div></div>'+
    '<div class="cinfo"><h2>大师共识裁决</h2><span class="signal '+sigCls+'">'+c.signal+'</span>'+
    '<div class="desc">'+esc(c.description)+' · 置信度 '+(c.confidence*100).toFixed(0)+'% · '+esc(d.timestamp)+'</div>'+
    '<div class="dist"><span class="d-b">偏多 '+c.distribution.bullish+' 位</span><span class="d-n">中性 '+c.distribution.neutral+' 位</span><span class="d-s">偏空 '+c.distribution.bearish+' 位</span></div>'+
    '</div></div>'+
    '<div class="mgrid">'+masterCards+'</div>';
}
</script>
</body>
</html>
